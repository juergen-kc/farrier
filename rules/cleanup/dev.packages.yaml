# Package manager caches. See docs/RULE_PACKS.md for the format.
pack:
  id: dev.packages
  title: Package manager caches
  version: 1

rules:
  - id: dev.packages.npm
    title: npm cache
    kind: cleanup
    tier: T2
    targets:
      - path: ~/.npm/_cacache
        type: directory
    regenerable: true
    minAge: 30d                   # no "npm isn't running" condition: npm runs as `node`, like Claude Code
    evidence: >
      Packages npm downloaded before. It downloads them again on the next install that needs them;
      `npm cache clean --force` removes the same folder. Only listed when nothing in it was written or
      read for 30 days, so no install is using it.

  - id: dev.packages.cargo
    title: Cargo download cache
    kind: cleanup
    tier: T2
    targets:
      - path: ~/.cargo/registry/cache
        type: directory
    regenerable: true
    minAge: 30d
    when:
      processNotRunning: [cargo]
    evidence: >
      Compressed crates Cargo downloaded. The unpacked sources it builds from stay; Cargo fetches the
      archives again when it needs them.

  - id: dev.packages.gradle
    title: Gradle caches
    kind: cleanup
    tier: T2
    targets:
      - path: ~/.gradle/caches/*
        type: directory
    regenerable: true
    minAge: 30d                   # no "Gradle isn't running" condition: its daemon is `java`, like many apps
    evidence: >
      Dependencies and build outputs Gradle cached. The next build downloads and rebuilds what it needs,
      which takes longer once. Only listed when nothing in it was written or read for 30 days.

