# Caches and logs in the user's Library. See docs/RULE_PACKS.md for the format.
pack:
  id: user.library
  title: Caches and logs
  version: 1

rules:
  - id: user.library.homebrew-downloads
    title: Homebrew downloads
    kind: cleanup
    tier: T2
    targets:
      - path: ~/Library/Caches/Homebrew/downloads/*
    regenerable: true
    minAge: 14d
    evidence: >
      Bottles and installers Homebrew already installed. It downloads them again if it ever needs them,
      which is also what `brew cleanup` removes.

  - id: user.library.caches
    title: App caches not used for 30 days
    kind: cleanup
    tier: T2
    targets:
      - path: ~/Library/Caches/*
        exclude: ["com.apple.*", "CloudKit", "Homebrew", "FamilyCircle", "GeoServices"]
    regenerable: true
    minAge: 30d
    evidence: >
      Data apps keep to be faster, which they rebuild when it's missing. Only caches nothing has written
      to or read for 30 days are listed, and Apple's own are left alone.

  - id: user.library.logs
    title: Logs not written for 30 days
    kind: cleanup
    tier: T2
    targets:
      - path: ~/Library/Logs/*
        exclude: ["DiagnosticReports", "com.apple.*"]
    regenerable: false            # nothing recreates old logs; crash reports are kept
    minAge: 30d
    evidence: >
      Log files apps wrote and no longer write to. They only help when you're looking into a problem
      from that time; crash reports (DiagnosticReports) are never listed.
