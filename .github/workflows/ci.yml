name: CI

# Runs on every push (any branch). The checks attach to the commit, so they also show up on pull requests,
# without running twice.
on:
  push:
  pull_request:   # needed for pull requests from forks, which don't push to this repository
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # FarrierCore and the CLI are platform-independent so far, so a Linux job gives fast, cheap feedback.
  linux:
    name: Linux (Swift 6.1)
    # Same-repository PRs are already covered by the push run; run on pull_request only for forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Register the Swift problem matcher
        run: echo "::add-matcher::.github/swift-problem-matcher.json"
      - run: swift --version
      - run: swift build --build-tests
      - run: swift test
      - name: Lint the bundled rule packs
        run: swift run farrier rules lint rules
      - name: Evaluate the sample facts
        run: swift run farrier posture --facts examples/facts-sample.json
      # The sample's firewall is off and not managed, so this must produce a T4 plan with exactly that item.
      - name: Plan fixes for the sample facts
        run: |
          swift run farrier plan posture --facts examples/facts-sample.json
          swift run farrier plan posture --facts examples/facts-sample.json --json > plan.json
          cat plan.json
          test "$(grep -c '"action" : ' plan.json)" = 1
          grep -q '"action" : "firewall.enable"' plan.json
          grep -q '"tier" : "T4"' plan.json
          swift run farrier plan list
          swift run farrier journal verify
      - name: MCP server smoke test
        run: scripts/mcp-smoke.sh "$(swift build --show-bin-path)/farrier"

  # The product target. Later PRs add the macOS-only collectors, helper and MCP server here.
  macos:
    name: macOS
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Register the Swift problem matcher
        run: echo "::add-matcher::.github/swift-problem-matcher.json"
      - run: swift --version
      - run: swift build --build-tests
      - run: swift test
      - name: Lint the bundled rule packs
        run: swift run farrier rules lint rules
      # Real collection on the runner: checks the parsers against genuine macOS output. An `unparsed` note here
      # means a parser needs a new golden case.
      - name: Collect facts on the runner
        run: swift run farrier facts
      - name: Launch items on the runner
        run: |
          swift run farrier facts --json > launch-facts.json
          python3 - <<'PY'
          import json
          items = json.load(open("launch-facts.json"))["facts"].get("launchd.items", [])
          for i in items:
              s = i.get("signature", {})
              print(f'{i.get("scope", "?"):14} {i.get("label", "?"):50} {s.get("source", "-"):26} team={s.get("teamID")} script={i.get("script")} {s.get("error") or i.get("error") or ""}')
          PY
      - name: Live posture on the runner
        run: swift run farrier posture
      # Apps with their signatures, system extensions, admins: the parts only the inventory collects.
      - name: Live inventory on the runner
        run: |
          swift run farrier inventory --section apps --section systemExtensions --section admins
          swift run farrier inventory --json > inventory.json
          python3 -c 'import json; s={x["id"]: x for x in json.load(open("inventory.json"))["sections"]}; assert s["apps"]["available"] and s["apps"]["items"], s["apps"]; assert s["admins"]["available"], s["admins"]; print("apps:", len(s["apps"]["items"]), "flagged:", s["apps"]["flagged"])'
          # For comparison: Gatekeeper's own verdict on each flagged app.
          swift run farrier inventory --section apps --flagged --json \
            | python3 -c 'import json,sys; [print(a["path"]) for x in json.load(sys.stdin)["sections"] for a in x["items"]]' \
            | while read -r app; do spctl --assess --type execute -vv "$app" 2>&1 | tr '\n' ' '; echo; done
      # --redact on a real Mac: the runner's account, host and home folder must not appear; placeholders must.
      - name: Redacted output on the runner
        run: |
          swift run farrier inventory --section admins --section launchItems --redact
          swift run farrier facts --redact --json > redacted.json
          swift run farrier inventory --redact --json >> redacted.json
          ! grep -n -e "/Users/$USER" -e "\"$USER\"" -e "$(scutil --get ComputerName)" redacted.json
          grep -q '<user>' redacted.json
      # Without the helper, MDM profiles can't be checked, so nothing may be planned (the firewall is left out).
      - name: Plan on the runner (no helper)
        run: swift run farrier plan posture
      - name: MCP server smoke test
        run: scripts/mcp-smoke.sh "$(swift build --show-bin-path)/farrier"
      - name: Fail if any parser didn't recognise its output
        run: |
          swift run farrier facts --json > facts.json
          # Every command-backed fact must actually be collected on a real Mac: an unparsed, failed or unavailable
          # one would otherwise leave its parser untested while the job passes.
          python3 - <<'PY'
          import json, sys
          notes = {n["fact"]: n for n in json.load(open("facts.json"))["notes"]}
          required = ["os.version", "filevault.status", "sip.status", "gatekeeper.assessments",
                      "firewall.globalState", "mdm.enrollment", "launchd.items",
                      "firewall.stealthMode", "network.listeningTCP"]
          bad = [f"{f}: {notes.get(f, {}).get('status', 'missing')} ({notes.get(f, {}).get('detail')})"
                 for f in required if notes.get(f, {}).get("status") != "collected"]
          bad += [f"{f}: unparsed ({n.get('detail')})" for f, n in notes.items() if n["status"] == "unparsed"]
          for b in bad: print(f"::error::{b}")
          sys.exit(1 if bad else 0)
          PY
      # Assembles and ad hoc signs Farrier.app (CLI, helper, LaunchDaemon plist). A structure check only: an ad hoc
      # helper refuses to start, because it can't pin its clients without a Team ID.
      - name: Build Farrier.app (ad hoc)
        run: |
          SIGN_IDENTITY=- ./scripts/build-app.sh
          test -x build/Farrier.app/Contents/MacOS/farrier
          test -x build/Farrier.app/Contents/MacOS/farrier-helper
          plutil -lint build/Farrier.app/Contents/Info.plist build/Farrier.app/Contents/Library/LaunchDaemons/dev.farrier.helper.plist
          test -s build/Farrier.app/Contents/Resources/AppIcon.icns
          test -x build/Farrier.app/Contents/Resources/uninstall.sh
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' build/Farrier.app/Contents/Info.plist)" = AppIcon
          bash -n scripts/install.sh && bash -n scripts/uninstall.sh
          ruby -c Packaging/homebrew/farrier.rb
          build/Farrier.app/Contents/MacOS/farrier helper status
          # The bundled rule packs work from any directory.
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/build/Farrier.app/Contents/MacOS/farrier" rules lint)
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/build/Farrier.app/Contents/MacOS/farrier" posture)
